name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on lib/
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './lib'
          severity: warning

      - name: Run ShellCheck on bin/
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: 'bin/ocd'
          severity: warning

  test:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install bats-core jq

      - name: Run tests
        run: bats tests/bats/*.bats

  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          for f in lib/*.sh bin/ocd; do
            echo "Checking $f..."
            bash -n "$f"
          done

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUN_VERSION=1.3.5 \
            --build-arg OPENCODE_AI_VERSION=1.1.6 \
            -t ocd-test .

      - name: Verify image
        run: docker run --rm ocd-test opencode --version
