name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main]

# 取消同分支的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on lib/
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './lib'
          severity: warning

      - name: Run ShellCheck on bin/
        uses: ludeeus/action-shellcheck@master
        with:
          additional_files: 'bin/ocd'
          severity: warning

  test:
    name: Unit Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install bats-core jq fswatch
          # Verify installation
          which bats || echo "bats not in PATH, checking brew prefix..."
          ls -la $(brew --prefix)/bin/bats* || true

      - name: Run tests
        run: |
          # Ensure Homebrew binaries are in PATH
          eval "$(brew shellenv)"
          echo "Running $(ls tests/bats/*.bats | wc -l | tr -d ' ') test files..."
          bats tests/bats/*.bats

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test File | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          for f in tests/bats/*.bats; do
            name=$(basename "$f" .bats)
            count=$(grep -c '^@test' "$f" || echo 0)
            echo "| $name | $count |" >> $GITHUB_STEP_SUMMARY
          done

  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          echo "Checking shell scripts..."
          for f in lib/*.sh bin/ocd scripts/*.sh; do
            if [[ -f "$f" ]]; then
              echo "  $f"
              bash -n "$f"
            fi
          done
          echo "All syntax checks passed!"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read versions
        id: versions
        run: |
          echo "ocd_version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ocd:${{ steps.versions.outputs.ocd_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUN_VERSION=1.3.5
            OPENCODE_AI_VERSION=1.1.6

      - name: Verify image
        run: |
          docker build \
            --build-arg BUN_VERSION=1.3.5 \
            --build-arg OPENCODE_AI_VERSION=1.1.6 \
            -t ocd-test .
          docker run --rm ocd-test opencode --version
