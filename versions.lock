# ================================================
# OCD (OpenCode Docker) 版本锁定文件
# ================================================
#
# 升级方式：
#   镜像内置 → 改版本后运行 ocd -r
#   运行时安装 → 改版本后运行 ocd --clean（自动清理缓存）
#
# ================================================

# ================================================
# 镜像内置 (ocd -r)
# ================================================

# Docker 基础镜像
BUN_VERSION=1.3.9

# OpenCode 核心 CLI
OPENCODE_AI_VERSION=1.2.5

# Python 依赖
PIP_REQUESTS=2.32.5
PIP_PANDAS=3.0.0
PIP_NUMPY=2.4.2
PIP_MATPLOTLIB=3.10.8
PIP_BEAUTIFULSOUP4=4.14.3
PIP_PILLOW=12.1.1

# NotebookLM Skill
PIP_NOTEBOOKLM_PY=0.3.2

# ================================================
# 运行时安装 (ocd --clean + 清缓存)
# ================================================

# OpenCode 插件
OH_MY_OPENCODE_VERSION=3.6.0
OPENCODE_ANTIGRAVITY_AUTH_VERSION=1.5.1

# MCP 服务器
PLAYWRIGHT_MCP_VERSION=0.0.68
