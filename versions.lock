# ================================================
# OCD (OpenCode Docker) 版本锁定文件
# ================================================
# 用法：集中管理所有依赖版本，确保构建可重现
# 更新：手动编辑此文件后，运行 ocd -r 重建镜像
# ================================================

# ------------------------------------------------
# Docker 基础镜像
# ------------------------------------------------
BUN_VERSION=1.3.5

# ------------------------------------------------
# Python 依赖 (pip)
# ------------------------------------------------
PIP_REQUESTS=2.32.5
PIP_PANDAS=2.2.3
PIP_NUMPY=2.2.1
PIP_MATPLOTLIB=3.10.0
PIP_BEAUTIFULSOUP4=4.12.3
PIP_PILLOW=11.1.0

# ------------------------------------------------
# OpenCode 核心
# ------------------------------------------------
OPENCODE_AI_VERSION=1.1.11

# ------------------------------------------------
# OpenCode 插件
# ------------------------------------------------
OH_MY_OPENCODE_VERSION=2.14.0
OPENCODE_ANTIGRAVITY_AUTH_VERSION=1.2.6

# ------------------------------------------------
# MCP 服务器
# ------------------------------------------------
PLAYWRIGHT_MCP_VERSION=0.0.54
EXA_MCP_VERSION=3.1.3

# ------------------------------------------------
# 工具版本 (可选锁定)
# ------------------------------------------------
# UV_VERSION=0.5.14
# NODE_MAJOR=22
